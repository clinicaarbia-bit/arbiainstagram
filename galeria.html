body{background:#01241D;color:#F2EDE2;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column}

.dot{width:7px;height:7px;border-radius:50%;background:rgba(242,237,226,.25);cursor:pointer;border:none;transition:.2s}
.dot.active{background:#F2EDE2;transform:scale(1.4)}

    <button class="btn" id="prev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="next"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <div class="counter" id="counter">1 / 5</div>
</div>

<script>
var cur = 0, n = 5;
var slides = document.querySelectorAll('.slide');
var dots = document.getElementById('dots');
var counter = document.getElementById('counter');

for(var i=0;i<n;i++){
  var d=document.createElement('button');
  d.className='dot'+(i===0?' active':'');
  (function(idx){d.onclick=function(){go(idx);};})(i);
  dots.appendChild(d);
}

function go(x){
  slides[cur].classList.remove('active');
  dots.children[cur].classList.remove('active');
  cur=(x+n)%n;
  slides[cur].classList.add('active');
  dots.children[cur].classList.add('active');
  counter.textContent=(cur+1)+' / '+n;
}

document.getElementById('next').onclick=function(){go(cur+1);};
document.getElementById('prev').onclick=function(){go(cur-1);};

var tx=0;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40){if(dx<0)go(cur+1);else go(cur-1);}
});

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1);
});
</script>
